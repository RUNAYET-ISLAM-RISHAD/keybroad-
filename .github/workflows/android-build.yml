name: Build Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Add Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore/keybroad-release.jks
      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p android/keystore
          cat > android/keystore.properties <<EOF
          storeFile=keystore/keybroad-release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
      - name: Build Rust Core
        run: |
          cd core
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 build --release
      - name: Copy .so files
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp core/target/aarch64-linux-android/release/libkeybroad_core.so android/app/src/main/jniLibs/arm64-v8a/
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          cp core/target/armv7-linux-androideabi/release/libkeybroad_core.so android/app/src/main/jniLibs/armeabi-v7a/
          mkdir -p android/app/src/main/jniLibs/x86_64
          cp core/target/x86_64-linux-android/release/libkeybroad_core.so android/app/src/main/jniLibs/x86_64/
      - name: Build Signed APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Copy release APK to debug name
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/app-debug.apk
      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-debug.apk
