name: Build Android APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          target: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Build Rust Core
        run: |
          cd core
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 build --release
      - name: Copy .so files
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp core/target/aarch64-linux-android/release/libkeybroad_core.so android/app/src/main/jniLibs/arm64-v8a/
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          cp core/target/armv7-linux-androideabi/release/libkeybroad_core.so android/app/src/main/jniLibs/armeabi-v7a/
          mkdir -p android/app/src/main/jniLibs/x86_64
          cp core/target/x86_64-linux-android/release/libkeybroad_core.so android/app/src/main/jniLibs/x86_64/
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
