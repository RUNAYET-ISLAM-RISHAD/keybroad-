[package]
name = "keybroad_core"
version = "0.1.0"
edition = "2021"
description = "Core engine for the Keybroad Bengali keyboard"
authors = ["Keybroad Team"]
license = "MIT"

[lib]
name = "keybroad_core"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "keybroad_cli"
path = "src/bin/cli.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jni = "0.21"
unicode-normalization = "0.1"
unicode-segmentation = "1.10"
